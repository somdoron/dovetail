name: Release

on:
  pull_request:
    paths:
      - 'dovetail/**'
      - 'vscode-dovetail/**'
      - 'LICENSE-*'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
      - 'tools/test-installers.*'
      - 'website/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tools/test-installers.py
      - run: npm --prefix website ci
      - run: npm --prefix website run check
      - run: npm --prefix website run build

  build-extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode-dovetail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-dovetail/package-lock.json
      - name: Validate extension release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node - <<'JS'
          const expected = 'v' + require('./package.json').version;
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Release tag must match extension version ${expected}`);
          }
          JS
      - run: npm ci
      - name: Package extension and checksum
        run: |
          npm run package
          sha256sum *.vsix > dovetail-language.vsix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: |
            vscode-dovetail/*.vsix
            vscode-dovetail/*.vsix.sha256
          if-no-files-found: error

  verify-crate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the crates.io package builds independently
        run: cargo publish --package dovetail-lang --locked --dry-run

  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      # Runtime identity hashes source bytes; keep Windows checkouts identical.
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path('dovetail/Cargo.toml').read_text())
          expected = 'v' + manifest['package']['version']
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Release tag {actual!r} must match compiler version {expected!r}')
          PYTHON
      - uses: Swatinem/rust-cache@v2
      - name: Build official executable
        run: cargo build --release --locked --bin dovetail
      - name: Smoke-test compiler
        working-directory: dovetail/tests/fixtures/image
        run: |
          cargo run --release --locked -- --version
          cargo run --release --locked -- run app
      - name: Build image and execute its precompiled application
        if: runner.os == 'Linux'
        working-directory: dovetail/tests/fixtures/image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cargo run --release --locked -- image build -p app --platform "$PLATFORM"
          mkdir -p extracted
          tar --no-same-owner -xf build/images/app.oci.tar -C extracted
          python3 - <<'PY'
          import json, pathlib, tarfile
          root = pathlib.Path('extracted')
          def blob(descriptor):
              return root / 'blobs' / descriptor['digest'].replace(':', '/')
          layout = json.loads((root / 'index.json').read_text())
          index = json.loads(blob(layout['manifests'][0]).read_text())
          image = json.loads(blob(index['manifests'][0]).read_text())
          layer = blob(image['layers'][-1])
          with tarfile.open(layer) as archive:
              archive.extractall('application', filter='data')
          config = pathlib.Path('application/app/dovetail-image.json')
          data = json.loads(config.read_text())
          data['component'] = str(pathlib.Path('application/app/application.cwasm').resolve())
          config.write_text(json.dumps(data))
          PY
          cargo run --release --locked -- image run --config application/app/dovetail-image.json
      - uses: docker/setup-docker-action@v5
        if: runner.os == 'Linux'
      - name: Run the packaged Linux image
        if: runner.os == 'Linux'
        working-directory: dovetail/tests/fixtures/image
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          # Use the extracted layout so Skopeo does not try to restore root ownership.
          # Skopeo needs the endpoint explicitly; it does not use Docker CLI contexts.
          docker_host=$(docker context inspect --format '{{.Endpoints.docker.Host}}')
          skopeo copy --dest-daemon-host "$docker_host" oci:extracted docker-daemon:dovetail-image-smoke:ci
          docker run --rm dovetail-image-smoke:ci
      - name: Package executable and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PYTHON'
          import hashlib, os, pathlib, shutil
          suffix = '.exe' if os.name == 'nt' else ''
          source = pathlib.Path('target/release') / ('dovetail' + suffix)
          destination = pathlib.Path('dist') / ('dovetail-' + os.environ['TARGET'] + suffix)
          destination.parent.mkdir(exist_ok=True)
          shutil.copy2(source, destination)
          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          destination.with_name(destination.name + '.sha256').write_text(
              f'{digest}  {destination.name}\n', encoding='utf-8')
          PYTHON
      - name: Verify Windows installer against the packaged executable
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/test-installers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [build, build-extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: dist
      - name: Attach binaries and VS Code extension to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*

  promote-website:
    if: github.event_name == 'release'
    needs: [publish, verify-website]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: promote-release-website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance the Render branch to the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Include prereleases: Dovetail currently publishes preview versions.
          latest=$(gh api --paginate --slurp "repos/$GH_REPO/releases" \
            --jq 'add | map(select(.draft == false)) | max_by(.published_at).tag_name')
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "Skipping older release $RELEASE_TAG; newest published release is $latest."
            exit 0
          fi
          # A leased push permits release tags off main without overwriting a concurrent update.
          previous=$(git ls-remote origin refs/heads/render | cut -f1)
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git push --force-with-lease="refs/heads/render:$previous" origin "$commit:refs/heads/render"

  publish-extension:
    if: github.event_name == 'release'
    needs: [build, build-extension]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode-dovetail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-dovetail/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: vscode-dovetail/release
      - name: Publish extension to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo 'Set the VSCE_PAT repository secret to a Marketplace publishing token.' >&2
            exit 1
          fi
          sha256sum --check dovetail-language.vsix.sha256
          ../node_modules/.bin/vsce publish --packagePath ./*.vsix
        working-directory: vscode-dovetail/release

  publish-extension-openvsx:
    if: github.event_name == 'release'
    needs: [build, build-extension]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode-dovetail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-dovetail/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: vscode-dovetail/release
      - name: Publish extension to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo 'Set the OVSX_PAT repository secret to an Open VSX publishing token.' >&2
            exit 1
          fi
          sha256sum --check dovetail-language.vsix.sha256
          ../node_modules/.bin/ovsx publish ./*.vsix
        working-directory: vscode-dovetail/release

  publish-crate:
    if: github.event_name == 'release'
    needs: [build, verify-crate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish dovetail-lang to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'Set the CARGO_REGISTRY_TOKEN repository secret to a crates.io publish token.' >&2
            exit 1
          fi
          cargo publish --package dovetail-lang --locked
