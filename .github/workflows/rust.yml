name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Each integration-test binary links Wasmtime. Omit Rust debug symbols to
  # keep the combined build artifacts within the hosted runner's disk budget.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "rust-cache-no-debug"
        cache-on-failure: true
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Report build disk usage
      if: always()
      run: |
        df -h .
        du -sh target 2>/dev/null || true
    - name: Run Dovetail-language tests
      run: cargo run --bin dovetail -- test
      env:
        RUST_MIN_STACK: "16777216"
    - name: Set up Python for book validation
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Validate book links and complete examples
      run: python3 tools/check-book.py
      env:
        RUST_MIN_STACK: "16777216"
    - name: Validate AI guidance and complete examples
      run: python3 tools/check-ai.py
      env:
        RUST_MIN_STACK: "16777216"
